# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: rebalance-alert
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FINMIND_API_URL
        value: https://api.finmindtrade.com/api/v4/data
      - key: FALLBACK_PRICE_0050
        value: "160.0"
      - key: FALLBACK_PRICE_00631L
        value: "210.0"
      - key: MONGODB_DB_NAME
        value: rebalancealert
      # 以下請在 Render Dashboard 手動填入（勿寫入 repo）
      - key: MONGODB_URI
        sync: false
      # 選用：至 FinMind 註冊後在 Render Dashboard 手動加入
      # - key: FINMIND_TOKEN
      #   sync: false
